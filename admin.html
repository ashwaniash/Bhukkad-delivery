<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bhukkadganj — Admin</title>

<!-- ============================================================
  SETUP:
  1. Same FIREBASE_CONFIG as index.html — paste it below.
  2. ADMIN_PIN — change this from the default before using.
  3. Menu tab: add / edit / delete dishes. They are saved in Firestore
     ("menu" collection) and index.html reads them live. Firestore rules must
     allow read+write on /menu/{id} (see the rules block in index.html).
  4. This panel writes order status with no auth check beyond the PIN screen
     (the PIN only gates the browser UI, not Firestore itself). That's fine
     for a single-café internal tool, but for real security later, restrict
     the Firestore "orders" update rule to a specific admin email checked via
     Firebase Auth instead of relying on the PIN alone.
============================================================ -->
<script>
  const FIREBASE_CONFIG = {
    apiKey: "AIzaSyCesqIA7mo7is2g7WStUb4Yq6CbQE0L9wI",
    authDomain: "bhukkadganj.firebaseapp.com",
    projectId: "bhukkadganj",
    storageBucket: "bhukkadganj.firebasestorage.app",
    messagingSenderId: "365351427862",
    appId: "1:365351427862:web:a2774550c390753e68ba37"
  };
  const ADMIN_PIN = "1234";
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>
  :root{
    --ink:#1A1D16; --paper:#FFFFFF; --paper-2:#EEF4E4;
    --marigold:#7CB342; --teal:#33691E; --teal-dark:#1B5E20;
    --line:#E4E9DC; --red:#B3261E; --green:#1E5C1E;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Work Sans',sans-serif;}
  h1,h2{font-family:'Work Sans',sans-serif;font-weight:800;}
  button{font-family:inherit;cursor:pointer;border:none;}

  #pinScreen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--teal-dark);color:#fff;}
  #pinScreen h1{margin-bottom:20px;}
  #pinInput{padding:14px 18px;font-size:20px;border-radius:10px;border:none;text-align:center;letter-spacing:6px;width:160px;}
  #pinSubmit{margin-top:14px;background:var(--marigold);color:var(--ink);padding:10px 28px;border-radius:8px;font-weight:700;}
  #pinError{color:#FFB4B0;font-size:13px;margin-top:10px;display:none;}

  #dash{display:none;max-width:900px;margin:0 auto;padding:20px;}
  #dash.show{display:block;}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:10px;}
  .stat-bar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
  .stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 16px;font-size:13px;}
  .stat b{font-family:'Work Sans',sans-serif;font-weight:800;font-size:20px;display:block;}

  .filter-bar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
  .filter-bar button{padding:7px 16px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:13px;font-weight:600;color:#6b5e4f;}
  .filter-bar button.active{background:var(--ink);color:var(--paper);}

  .order-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px;}
  .order-top{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px;}
  .oid{font-size:12px;color:#9a8b76;}
  .cust-name{font-weight:700;font-size:16px;margin-top:2px;}
  .cust-meta{font-size:13px;color:#6b5e4f;margin-top:2px;}
  .addr-link{font-size:13px;color:var(--teal);text-decoration:none;font-weight:600;}
  .items-list{margin:12px 0;font-size:14px;}
  .items-list div{padding:3px 0;}
  .total{font-weight:700;font-size:15px;margin:6px 0 12px;}

  .status-pill{display:inline-block;padding:4px 12px;border-radius:999px;font-size:12px;font-weight:700;}
  .status-placed{background:#FDECC8;color:#8A5A00;}
  .status-confirmed{background:#DCEEFB;color:#0B5583;}
  .status-preparing{background:#FDECC8;color:#8A5A00;}
  .status-out_for_delivery{background:#E1EFE1;color:var(--green);}
  .status-delivered{background:#E7E7E7;color:#444;}
  .status-cancelled{background:#FBDCDC;color:#8A1E1E;}

  .action-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center;}
  .action-row button{padding:8px 14px;border-radius:8px;font-size:12px;font-weight:700;color:#fff;}
  .btn-confirm{background:#0B5583;}
  .btn-preparing{background:#8A5A00;}
  .btn-out{background:var(--green);}
  .btn-delivered{background:#555;}
  .btn-cancel{background:var(--red);}
  .eta-input{padding:7px 10px;border-radius:8px;border:1px solid var(--line);font-size:12px;width:110px;}
  .eta-save{background:var(--marigold);color:var(--ink);padding:7px 12px;border-radius:8px;font-size:12px;font-weight:700;}

  .empty-state{text-align:center;padding:60px 20px;color:#9a8b76;}

  /* ---- Menu manager ---- */
  .menu-toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
  .menu-toolbar p{margin:0;font-size:13px;color:#6b5e4f;}
  .btn-primary{background:var(--teal);color:#fff;padding:10px 18px;border-radius:10px;font-weight:700;font-size:13px;}
  .btn-ghost{background:#fff;color:var(--ink);border:1px solid var(--line);padding:8px 14px;border-radius:8px;font-weight:700;font-size:12px;}
  .btn-danger{background:#fff;color:var(--red);border:1px solid #F1C4C1;padding:8px 14px;border-radius:8px;font-weight:700;font-size:12px;}
  .menu-cat-title{font-weight:800;font-size:13px;letter-spacing:.4px;text-transform:uppercase;color:var(--teal);margin:18px 0 8px;}
  .menu-edit-row{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;flex-wrap:wrap;}
  .menu-edit-row.off{opacity:.55;}
  .menu-thumb{width:46px;height:46px;border-radius:10px;background:var(--paper-2);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;overflow:hidden;}
  .menu-thumb img{width:100%;height:100%;object-fit:cover;}
  .menu-edit-info{display:flex;align-items:center;gap:12px;flex:1;min-width:200px;}
  .menu-edit-name{font-weight:700;font-size:14px;}
  .menu-edit-meta{font-size:12px;color:#6b5e4f;margin-top:2px;}
  .veg-dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:#2E7D32;}
  .veg-dot.nv{background:#B3261E;}
  .menu-edit-controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .switch{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:#6b5e4f;cursor:pointer;}
  .empty-box{background:var(--paper-2);border-radius:14px;padding:26px 18px;text-align:center;font-size:14px;color:#33411f;}
  .empty-box button{margin-top:12px;}

  /* ---- Edit modal ---- */
  #itemModal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:50;align-items:flex-start;justify-content:center;overflow-y:auto;padding:20px 12px;}
  #itemModal.show{display:flex;}
  .modal-card{background:#fff;border-radius:16px;width:100%;max-width:560px;padding:20px;margin:auto 0;}
  .modal-card h3{margin:0 0 14px;font-weight:800;font-size:18px;}
  .fld{margin-bottom:12px;}
  .fld label{display:block;font-size:12px;font-weight:700;color:#6b5e4f;margin-bottom:4px;}
  .fld input[type=text],.fld input[type=number],.fld input[type=url],.fld textarea,.fld select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:14px;font-family:inherit;background:#fff;}
  .fld textarea{resize:vertical;min-height:56px;}
  .fld-row{display:flex;gap:10px;}
  .fld-row .fld{flex:1;min-width:0;}
  .check-row{display:flex;gap:18px;flex-wrap:wrap;margin:4px 0 12px;}
  .check-row label{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;cursor:pointer;}
  .mini-row{display:flex;gap:8px;margin-bottom:8px;}
  .mini-row input{flex:1;min-width:0;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;font-family:inherit;}
  .mini-row input.num{flex:0 0 90px;}
  .mini-row button{background:#fff;border:1px solid #F1C4C1;color:var(--red);border-radius:8px;width:34px;font-weight:800;}
  .add-mini{background:var(--paper-2);color:var(--teal-dark);padding:7px 12px;border-radius:8px;font-size:12px;font-weight:700;}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;}
  #formError{color:var(--red);font-size:13px;font-weight:600;margin-top:8px;display:none;}
</style>
</head>
<body>

<div id="pinScreen">
  <h1>Bhukkadganj Admin</h1>
  <input id="pinInput" type="password" maxlength="6" placeholder="••••">
  <button id="pinSubmit" onclick="checkPin()">Unlock</button>
  <div id="pinError">Galat PIN, dobara try karo.</div>
</div>

<div id="dash">
  <header>
    <h2 style="margin:0" id="dashTitle">Orders</h2>
    <div class="stat-bar">
      <div class="stat"><b id="statToday">0</b>Today's orders</div>
      <div class="stat"><b id="statActive">0</b>Active</div>
      <div class="stat"><b id="statRevenue">₹0</b>Today's revenue</div>
    </div>
  </header>

  <div class="filter-bar" style="margin-bottom:10px">
    <button class="active" data-tab="orders" onclick="setTab('orders',this)">Orders</button>
    <button data-tab="menu" onclick="setTab('menu',this)">Menu</button>
  </div>

  <div id="ordersPane">
  <div class="filter-bar">
    <button class="active" data-f="all" onclick="setFilter('all',this)">All</button>
    <button data-f="placed" onclick="setFilter('placed',this)">Placed</button>
    <button data-f="confirmed" onclick="setFilter('confirmed',this)">Confirmed</button>
    <button data-f="preparing" onclick="setFilter('preparing',this)">Preparing</button>
    <button data-f="out_for_delivery" onclick="setFilter('out_for_delivery',this)">Out for delivery</button>
    <button data-f="delivered" onclick="setFilter('delivered',this)">Delivered</button>
  </div>

  <div id="ordersList"></div>
  </div>

  <div id="menuPane" style="display:none">
    <div class="menu-toolbar">
      <p>Yahan se dish add, edit ya delete karo — customer app me turant update ho jaata hai.</p>
      <button class="btn-primary" onclick="openItemForm(null)">+ Add item</button>
    </div>
    <div id="menuEditList"></div>
  </div>
</div>

<!-- ADD / EDIT ITEM MODAL -->
<div id="itemModal">
  <div class="modal-card">
    <h3 id="modalTitle">Add item</h3>
    <div class="fld"><label>Dish name *</label><input type="text" id="fName" placeholder="e.g. Paneer Tikka"></div>
    <div class="fld-row">
      <div class="fld"><label>Category *</label><input type="text" id="fCat" list="catList" placeholder="e.g. Starters"><datalist id="catList"></datalist></div>
      <div class="fld"><label>Emoji</label><input type="text" id="fEmoji" maxlength="4" placeholder="🍛"></div>
    </div>
    <div class="fld"><label>Photo URL (optional — emoji ki jagah dikhegi)</label><input type="url" id="fImg" placeholder="https://..."></div>
    <div class="fld"><label>Description</label><textarea id="fDesc" placeholder="Short line about the dish"></textarea></div>
    <div class="fld-row">
      <div class="fld"><label>Serves</label>
        <select id="fServes">
          <option value="">Not shown</option>
          <option value="1">Serves 1</option>
          <option value="1-2">Serves 1-2</option>
          <option value="2-3">Serves 2-3</option>
          <option value="3-4">Serves 3-4</option>
        </select>
      </div>
      <div class="fld" id="priceFld"><label>Price (₹) *</label><input type="number" id="fPrice" min="0" step="1" placeholder="e.g. 120"></div>
    </div>
    <div class="check-row">
      <label><input type="checkbox" id="fVeg" checked> Veg</label>
      <label><input type="checkbox" id="fAvail" checked> Available (customers ko dikhe)</label>
      <label><input type="checkbox" id="fUseSizes" onchange="toggleSizes()"> Multiple sizes (Half / Full…)</label>
    </div>
    <div id="sizesSection" style="display:none" class="fld">
      <label>Sizes — pehla size default hota hai</label>
      <div id="sizesBox"></div>
      <button type="button" class="add-mini" onclick="addSizeRow()">+ Add size</button>
    </div>
    <div class="fld">
      <label>Add-ons (optional)</label>
      <div id="addonsBox"></div>
      <button type="button" class="add-mini" onclick="addAddonRow()">+ Add add-on</button>
    </div>
    <div id="formError"></div>
    <div class="modal-actions">
      <button class="btn-ghost" onclick="closeItemForm()">Cancel</button>
      <button class="btn-primary" id="saveItemBtn" onclick="saveItem()">Save</button>
    </div>
  </div>
</div>

<script>
function checkPin(){
  const val = document.getElementById('pinInput').value;
  if(val === ADMIN_PIN){
    document.getElementById('pinScreen').style.display = 'none';
    document.getElementById('dash').classList.add('show');
    initFirebaseAndListen();
  } else {
    document.getElementById('pinError').style.display = 'block';
  }
}
document.getElementById('pinInput').addEventListener('keydown', e=>{ if(e.key==='Enter') checkPin(); });

let allOrders = [];
let currentFilter = 'all';
let db;

/* ---------------- Menu manager ----------------
   Items live in Firestore collection "menu" (doc id = item id). index.html
   listens to the same collection, so every change here shows up for customers
   immediately. DEFAULT_MENU is only used by the one-click "Import default menu"
   button the first time, so you don't have to retype the starting dishes. */
const DEFAULT_MENU = [
  {id:'m1', cat:'Starters', name:'Paneer Tikka', desc:'Char-grilled cottage cheese with smoky spices.', veg:true, emoji:'🧀', bg:'rgba(124,179,66,.18)', serves:'1-2',
    sizes:[{label:'Half',price:180},{label:'Full',price:320}],
    addons:[{name:'Extra Chutney',price:20},{name:'Extra Paneer',price:60}]},
  {id:'m2', cat:'Starters', name:'Chicken Seekh Kebab', desc:'Minced chicken skewers roasted over coal.', veg:false, emoji:'🍢', bg:'rgba(85,139,47,.14)', serves:'1-2',
    sizes:[{label:'Half',price:220},{label:'Full',price:400}],
    addons:[{name:'Extra Mint Chutney',price:20}]},
  {id:'m3', cat:'Main Course', name:'Butter Chicken', desc:'Creamy tomato gravy, slow-cooked chicken.', veg:false, emoji:'🍛', bg:'rgba(124,179,66,.18)', serves:'2-3',
    sizes:[{label:'Half',price:260},{label:'Full',price:460}],
    addons:[{name:'Extra Butter',price:30},{name:'Extra Gravy',price:40}]},
  {id:'m4', cat:'Main Course', name:'Dal Makhani', desc:'Black lentils simmered overnight with butter.', veg:true, emoji:'🍲', bg:'rgba(85,139,47,.14)', serves:'2-3', price:220,
    addons:[{name:'Extra Butter',price:20}]},
  {id:'m5', cat:'Main Course', name:'Veg Biryani', desc:'Fragrant basmati rice with garden vegetables.', veg:true, emoji:'🍚', bg:'rgba(124,179,66,.18)', serves:'1-2',
    sizes:[{label:'Half',price:190},{label:'Full',price:340}],
    addons:[{name:'Raita',price:30},{name:'Extra Gravy',price:30}]},
  {id:'m6', cat:'Breads', name:'Butter Naan', desc:'Soft tandoor-baked bread brushed with butter.', veg:true, emoji:'🫓', bg:'rgba(85,139,47,.14)', serves:'1', price:40},
  {id:'m7', cat:'Beverages', name:'Masala Chai', desc:'Classic spiced milk tea.', veg:true, emoji:'🍵', bg:'rgba(124,179,66,.18)', serves:'1', price:30},
  {id:'m8', cat:'Beverages', name:'Cold Coffee', desc:'Chilled and frothy, topped with cream.', veg:true, emoji:'🥤', bg:'rgba(85,139,47,.14)', serves:'1',
    sizes:[{label:'Regular',price:90},{label:'Large',price:130}]},
];

let menuItems = [];
let menuLoaded = false;
let menuLoadError = '';
let editingId = null;

const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function setTab(tab, el){
  document.querySelectorAll('.filter-bar button[data-tab]').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('ordersPane').style.display = tab==='orders' ? 'block' : 'none';
  document.getElementById('menuPane').style.display = tab==='menu' ? 'block' : 'none';
  document.getElementById('dashTitle').textContent = tab==='orders' ? 'Orders' : 'Menu';
}

function listenMenu(){
  db.collection('menu').onSnapshot(snap=>{
    menuItems = snap.docs.map(d=>({id:d.id, ...d.data()}))
      .sort((a,b)=>(a.order ?? 9999)-(b.order ?? 9999) || String(a.name).localeCompare(String(b.name)));
    menuLoaded = true; menuLoadError = '';
    renderMenuTab();
  }, err=>{
    console.error(err);
    menuLoaded = true;
    menuLoadError = err.message;
    renderMenuTab();
  });
}

function itemPriceText(m){
  if(m.sizes && m.sizes.length) return m.sizes.map(s=>`${esc(s.label)} ₹${s.price}`).join(' · ');
  return m.price!=null ? '₹'+m.price : '—';
}

function renderMenuTab(){
  const box = document.getElementById('menuEditList');
  if(menuLoadError){
    box.innerHTML = `<div class="empty-box">Menu load nahi hua: ${esc(menuLoadError)}<br>Firestore rules me <b>/menu/{id}</b> ke liye read + write allow karo (rules index.html ke top comment me hain).</div>`;
    return;
  }
  if(!menuLoaded){ box.innerHTML = `<div class="empty-state">Loading…</div>`; return; }
  if(menuItems.length===0){
    box.innerHTML = `<div class="empty-box">Abhi menu khaali hai.<br>Customer app abhi built-in default dishes dikha raha hai.<br>
      <button class="btn-primary" onclick="importDefaultMenu()">Import default menu (8 dishes)</button><br>
      <span style="font-size:12px;opacity:.8">ya upar "+ Add item" se naya dish banao.</span></div>`;
    return;
  }
  const cats = [...new Set(menuItems.map(m=>m.cat))];
  box.innerHTML = cats.map(c=>`
    <div class="menu-cat-title">${esc(c)}</div>
    ${menuItems.filter(m=>m.cat===c).map(m=>`
    <div class="menu-edit-row ${m.available===false?'off':''}">
      <div class="menu-edit-info">
        <div class="menu-thumb">${m.imageUrl?`<img src="${esc(m.imageUrl)}" alt="">`:esc(m.emoji||'🍽️')}</div>
        <div>
          <div class="menu-edit-name"><span class="veg-dot ${m.veg?'':'nv'}"></span>${esc(m.name)}</div>
          <div class="menu-edit-meta">${itemPriceText(m)}${m.serves?' · Serves '+esc(m.serves):''}${m.available===false?' · <b>Hidden</b>':''}</div>
        </div>
      </div>
      <div class="menu-edit-controls">
        <label class="switch"><input type="checkbox" ${m.available===false?'':'checked'} onchange="toggleAvailable('${m.id}',this.checked)"> Available</label>
        <button class="btn-ghost" onclick="openItemForm('${m.id}')">Edit</button>
        <button class="btn-danger" onclick="deleteItem('${m.id}')">Delete</button>
      </div>
    </div>`).join('')}
  `).join('');
}

async function toggleAvailable(id, on){
  try{ await db.collection('menu').doc(id).update({available:on}); }
  catch(err){ alert('Update nahi hua: '+err.message); }
}

async function deleteItem(id){
  const m = menuItems.find(x=>x.id===id);
  if(!m) return;
  if(!confirm(`"${m.name}" ko menu se delete karna hai? Ye wapas nahi aayega.`)) return;
  try{ await db.collection('menu').doc(id).delete(); }
  catch(err){ alert('Delete nahi hua: '+err.message); }
}

async function importDefaultMenu(){
  try{
    // carry over any older "Serves" overrides so nothing set earlier is lost
    const overrides = {};
    try{
      const o = await db.collection('menuOverrides').get();
      o.forEach(d=>{ overrides[d.id] = d.data().serves; });
    }catch(e){}
    const batch = db.batch();
    DEFAULT_MENU.forEach((m,i)=>{
      const {id, ...data} = m;
      if(overrides[id]) data.serves = overrides[id];
      batch.set(db.collection('menu').doc(id), {...data, available:true, order:i});
    });
    await batch.commit();
  } catch(err){ alert('Import nahi hua: '+err.message); }
}

/* ---- Add / edit form ---- */
function toggleSizes(){
  const on = document.getElementById('fUseSizes').checked;
  document.getElementById('sizesSection').style.display = on ? 'block' : 'none';
  document.getElementById('priceFld').style.display = on ? 'none' : 'block';
  if(on && document.getElementById('sizesBox').children.length===0) addSizeRow();
}
function rowHtml(kind, a, b){
  const ph1 = kind==='size' ? 'Size (e.g. Half)' : 'Add-on (e.g. Extra Cheese)';
  return `<input type="text" class="r-name" placeholder="${ph1}" value="${esc(a)}">
          <input type="number" class="num r-price" min="0" step="1" placeholder="₹" value="${b===''||b==null?'':b}">
          <button type="button" onclick="this.parentNode.remove()">✕</button>`;
}
function addSizeRow(label='', price=''){
  const d = document.createElement('div'); d.className='mini-row'; d.innerHTML = rowHtml('size',label,price);
  document.getElementById('sizesBox').appendChild(d);
}
function addAddonRow(name='', price=''){
  const d = document.createElement('div'); d.className='mini-row'; d.innerHTML = rowHtml('addon',name,price);
  document.getElementById('addonsBox').appendChild(d);
}
function readRows(boxId){
  return [...document.querySelectorAll('#'+boxId+' .mini-row')].map(r=>({
    name: r.querySelector('.r-name').value.trim(),
    price: r.querySelector('.r-price').value
  })).filter(x=>x.name || x.price!=='');
}

function openItemForm(id){
  editingId = id;
  const m = id ? menuItems.find(x=>x.id===id) : null;
  document.getElementById('modalTitle').textContent = m ? 'Edit item' : 'Add item';
  document.getElementById('fName').value = m ? m.name : '';
  document.getElementById('fCat').value = m ? m.cat : '';
  document.getElementById('fEmoji').value = m ? (m.emoji||'') : '🍽️';
  document.getElementById('fImg').value = m ? (m.imageUrl||'') : '';
  document.getElementById('fDesc').value = m ? (m.desc||'') : '';
  document.getElementById('fServes').value = m ? (m.serves||'') : '';
  document.getElementById('fVeg').checked = m ? !!m.veg : true;
  document.getElementById('fAvail').checked = m ? m.available!==false : true;
  document.getElementById('fPrice').value = m && m.price!=null ? m.price : '';
  document.getElementById('sizesBox').innerHTML = '';
  document.getElementById('addonsBox').innerHTML = '';
  const hasSizes = !!(m && m.sizes && m.sizes.length);
  document.getElementById('fUseSizes').checked = hasSizes;
  if(hasSizes) m.sizes.forEach(s=>addSizeRow(s.label, s.price));
  if(m && m.addons) m.addons.forEach(a=>addAddonRow(a.name, a.price));
  document.getElementById('catList').innerHTML = [...new Set(menuItems.map(x=>x.cat))].map(c=>`<option value="${esc(c)}">`).join('');
  toggleSizes();
  document.getElementById('formError').style.display = 'none';
  document.getElementById('itemModal').classList.add('show');
}
function closeItemForm(){ document.getElementById('itemModal').classList.remove('show'); }

function formFail(msg){
  const e = document.getElementById('formError');
  e.textContent = msg; e.style.display = 'block';
}

async function saveItem(){
  const name = document.getElementById('fName').value.trim();
  const cat = document.getElementById('fCat').value.trim();
  if(!name) return formFail('Dish ka naam daalo.');
  if(!cat) return formFail('Category daalo (e.g. Starters).');

  const useSizes = document.getElementById('fUseSizes').checked;
  const data = {
    name, cat,
    desc: document.getElementById('fDesc').value.trim(),
    veg: document.getElementById('fVeg').checked,
    emoji: document.getElementById('fEmoji').value.trim() || '🍽️',
    serves: document.getElementById('fServes').value,
    available: document.getElementById('fAvail').checked
  };
  const img = document.getElementById('fImg').value.trim();
  if(img) data.imageUrl = img;

  if(useSizes){
    const rows = readRows('sizesBox');
    if(rows.length===0) return formFail('Kam se kam ek size daalo, ya "Multiple sizes" band karo.');
    const sizes = [];
    for(const r of rows){
      const p = Number(r.price);
      if(!r.name || r.price==='' || isNaN(p) || p<0) return formFail('Har size ka naam aur price sahi daalo.');
      sizes.push({label:r.name, price:p});
    }
    data.sizes = sizes;
  } else {
    const p = Number(document.getElementById('fPrice').value);
    if(document.getElementById('fPrice').value==='' || isNaN(p) || p<0) return formFail('Price daalo.');
    data.price = p;
  }

  const addons = [];
  for(const r of readRows('addonsBox')){
    const p = Number(r.price);
    if(!r.name || r.price==='' || isNaN(p) || p<0) return formFail('Har add-on ka naam aur price sahi daalo.');
    addons.push({name:r.name, price:p});
  }
  if(addons.length) data.addons = addons;

  const existing = editingId ? menuItems.find(x=>x.id===editingId) : null;
  data.bg = existing && existing.bg ? existing.bg : (menuItems.length%2 ? 'rgba(85,139,47,.14)' : 'rgba(124,179,66,.18)');
  data.order = existing && existing.order!=null ? existing.order : (menuItems.reduce((mx,m)=>Math.max(mx, m.order ?? 0), 0) + 1);

  const btn = document.getElementById('saveItemBtn');
  btn.disabled = true; btn.textContent = 'Saving…';
  try{
    const id = editingId || ('m' + Date.now());
    await db.collection('menu').doc(id).set(data);   // full replace, so removed sizes/add-ons really go away
    closeItemForm();
  } catch(err){
    formFail('Save nahi hua: '+err.message);
  } finally {
    btn.disabled = false; btn.textContent = 'Save';
  }
}
document.getElementById('itemModal').addEventListener('click', e=>{ if(e.target.id==='itemModal') closeItemForm(); });

function initFirebaseAndListen(){
  firebase.initializeApp(FIREBASE_CONFIG);
  db = firebase.firestore();
  listenMenu();
  db.collection('orders').orderBy('createdAt','desc').onSnapshot(snap=>{
    allOrders = snap.docs.map(d=>({id:d.id, ref:d.ref, ...d.data()}));
    renderStats();
    renderList();
  }, err=>{
    console.error(err);
    alert('Firestore error: '+err.message);
  });
}

function renderStats(){
  const today = new Date(); today.setHours(0,0,0,0);
  const todays = allOrders.filter(o=>o.createdAt && o.createdAt.toDate() >= today);
  const active = allOrders.filter(o=>!['delivered','cancelled'].includes(o.status));
  const revenue = todays.filter(o=>o.status!=='cancelled').reduce((s,o)=>s+(o.total||0),0);
  document.getElementById('statToday').textContent = todays.length;
  document.getElementById('statActive').textContent = active.length;
  document.getElementById('statRevenue').textContent = '₹'+revenue;
}

function setFilter(f, el){
  currentFilter = f;
  document.querySelectorAll('#ordersPane .filter-bar button').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  renderList();
}

const STATUS_LABEL = {
  placed:'Placed', confirmed:'Confirmed', preparing:'Preparing',
  out_for_delivery:'Out for delivery', delivered:'Delivered', cancelled:'Cancelled'
};

function renderList(){
  let list = allOrders;
  if(currentFilter !== 'all') list = list.filter(o=>o.status===currentFilter);

  if(list.length===0){
    document.getElementById('ordersList').innerHTML = `<div class="empty-state">Koi order nahi mila.</div>`;
    return;
  }

  document.getElementById('ordersList').innerHTML = list.map(o=>{
    const addr = o.address || {};
    const mapUrl = addr.lat ? `https://www.google.com/maps?q=${addr.lat},${addr.lng}` : '#';
    const itemsHtml = (o.items||[]).map(i=>`<div>${esc(i.name)} × ${i.qty} — ₹${i.price*i.qty}</div>`).join('');
    return `
      <div class="order-card">
        <div class="order-top">
          <div>
            <div class="oid">#${o.id.slice(-6).toUpperCase()}</div>
            <div class="cust-name">${esc(o.customerName || 'Customer')}</div>
            <div class="cust-meta">${o.phone || o.email || ''} &middot; ${addr.label || 'Address'}</div>
            <a class="addr-link" href="${mapUrl}" target="_blank">📍 View location on map</a>
          </div>
          <span class="status-pill status-${o.status}">${STATUS_LABEL[o.status] || o.status}</span>
        </div>
        <div class="items-list">${itemsHtml}</div>
        <div class="total">Total: ₹${o.total}</div>
        <div class="action-row">
          <button class="btn-confirm" onclick="updateStatus('${o.id}','confirmed')">Confirm</button>
          <button class="btn-preparing" onclick="updateStatus('${o.id}','preparing')">Preparing</button>
          <button class="btn-out" onclick="updateStatus('${o.id}','out_for_delivery')">Out for delivery</button>
          <button class="btn-delivered" onclick="updateStatus('${o.id}','delivered')">Delivered</button>
          <button class="btn-cancel" onclick="updateStatus('${o.id}','cancelled')">Cancel</button>
        </div>
        <div class="action-row">
          <input class="eta-input" id="eta-${o.id}" placeholder="e.g. 25 mins" value="${o.eta||''}">
          <button class="eta-save" onclick="saveEta('${o.id}')">Save ETA</button>
        </div>
      </div>
    `;
  }).join('');
}

function updateStatus(orderId, status){
  const order = allOrders.find(o=>o.id===orderId);
  order.ref.update({status, updatedAt: firebase.firestore.FieldValue.serverTimestamp()});
}
function saveEta(orderId){
  const val = document.getElementById('eta-'+orderId).value;
  const order = allOrders.find(o=>o.id===orderId);
  order.ref.update({eta: val});
}
</script>
